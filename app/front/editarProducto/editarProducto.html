<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../gestionProductos/crearProductos.css">
    <link rel="stylesheet" href="editarProducto.css">
    <title>Editar producto</title>
</head>
<body>

    <main class="contenido">

        <div class="encabezado-pagina">
            <h1>Editar producto</h1>
            <p>Modifica los datos del producto.</p>
        </div>

        <section class="tarjeta">
            <h2>Datos del producto</h2>

            <form id="frmEditarProducto">

                <div class="grilla">
                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" required>
                    </div>

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required></select>
                    </div>

                    <div class="campo">
                        <label for="unidadMedida">Unidad de medida</label>
                        <select id="unidadMedida" required></select>
                    </div>
                </div>

                <div class="acciones">
                    <button type="submit">Guardar cambios</button>
                    <a href="../listaProductos/listaProductos.html">Volver a la lista</a>
                </div>

            </form>

            <p id="mensaje"></p>
        </section>

    </main>

    <script src="../api.js"></script>
    <script src="editarProducto.js"></script>

</body>
</html>
