<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="crearProductos.css">
    <title>Creación de productos</title>
</head>
<body>

    <main class="contenido">

        <div class="encabezado-pagina">
            <h1>Creación de productos</h1>
            <p>Registra un producto nuevo en el catálogo.</p>
        </div>

        <section class="tarjeta">
            <h2>Datos del producto</h2>

            <form id="frmProductos">

                <div class="grilla">
                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" name="codigo" placeholder="Código" required>
                    </div>

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria">
                            <option value="">Cargando categorías...</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="unidadMedida">Unidad de medida</label>
                        <select id="unidadMedida" name="unidadMedida">
                            <option value="">Seleccione una unidad de medida</option>
                        </select>
                    </div>
                </div>

                <div class="acciones">
                    <button type="submit">Crear producto</button>
                </div>

            </form>

            <p id="respuestaApi"></p>
        </section>

    </main>

    <script src="../api.js"></script>
    <script src="creacionProductos.js"></script>

</body>
</html>
